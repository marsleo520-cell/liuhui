<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>原型：生产订单整合</title>
  <style>
    :root {
      --color-primary: #009090;
      --color-primary-hover: #209E9E;
      --color-primary-active: #007A7A;
      --color-primary-light: #E7F6F6;
      --color-success: #00AC97;
      --color-success-light: #E8FFF8;
      --color-warning: #E37318;
      --color-warning-light: #FFF6E8;
      --color-danger: #D54941;
      --color-danger-light: #FFEDE8;
      --text-title: #181818;
      --text-regular: #4B4B4B;
      --text-secondary: #8B8B8B;
      --bg-page: #F5F6F7;
      --bg-card: #FFFFFF;
      --bg-muted: #F3F3F3;
      --border: #DCDCDC;
      --mask: rgba(0, 0, 0, 0.5);
      --shadow-base: 0 0 6px rgba(0, 0, 0, 0.1);
      --shadow-default: 0 0 12px rgba(0, 0, 0, 0.2);
      --ink: var(--text-title);
      --muted: var(--text-secondary);
      --line: var(--border);
      --bg: var(--bg-page);
      --card: var(--bg-card);
      --green: var(--color-primary);
      --danger: var(--color-danger);
      --focus: var(--color-primary);
      --yellow: #FFF6E8;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--text-regular); background: var(--bg-page); font: 14px/22px "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--color-primary); outline-offset: 2px; }
    .control { background: #181818; color: #fff; padding: 8px 16px 12px; }
    .control p { margin: 0 0 8px; font-size: 12px; line-height: 20px; }
    .control-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .control-row + .control-row { margin-top: 8px; }
    .control button { border: 0; background: #4B4B4B; color: #fff; border-radius: 999px; padding: 4px 12px; }
    .control button[aria-pressed="true"] { background: #fff; color: #181818; }
    .flag { color: #DCDCDC; font-size: 12px; line-height: 20px; }
    #app { min-height: calc(100vh - 92px); }
    .frame { display: flex; min-height: calc(100vh - 92px); background: var(--bg-page); }
    .sider { width: 232px; flex: none; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .brand { display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 16px; color: var(--color-primary); font-weight: 700; }
    .brand i { width: 24px; height: 24px; border-radius: 4px; background: var(--color-primary); display: inline-block; }
    .nav-search { margin: 0 16px 8px; }
    .menu { padding: 8px; }
    .menu button { display: flex; width: 100%; text-align: left; border: 0; background: transparent; border-radius: 4px; padding: 8px 12px; color: var(--text-regular); white-space: nowrap; }
    .menu button[aria-current="page"] { background: var(--bg-muted); color: var(--text-title); font-weight: 700; }
    .menu button:hover { background: var(--bg-muted); }
    .fav { margin-top: auto; padding: 16px; }
    .main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .navtabs { height: 48px; background: #fff; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; padding: 0 16px; }
    .navtabs button.tab { border: 0; background: var(--bg-muted); border-radius: 4px; padding: 4px 8px; color: var(--text-regular); }
    .navtabs button.tab[aria-current="page"] { background: var(--color-primary-light); color: var(--color-primary); }
    .navtabs .x { border: 0; background: transparent; color: var(--text-secondary); padding: 0 4px; }
    .nav-tools { margin-left: auto; display: flex; gap: 12px; color: var(--text-secondary); }
    .content { padding: 16px; }
    .panel { background: #fff; border-radius: 4px; padding: 16px; }
    .sample { display: inline-block; margin: 0 0 8px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 4px; color: var(--text-secondary); background: #fff; font-size: 12px; line-height: 20px; }
    h1 { font-size: 20px; line-height: 28px; margin: 0 0 16px; color: var(--text-title); font-weight: 700; }
    .crumb { margin: 0 0 16px; color: var(--text-secondary); }
    .crumb button { border: 0; background: transparent; color: var(--text-regular); padding: 0; }
    .filterbar { display: flex; gap: 12px; align-items: center; margin-bottom: 16px; }
    .filterbar .grow { display: flex; gap: 12px; flex: 1; flex-wrap: wrap; }
    .filterbar label { display: flex; align-items: center; gap: 8px; color: var(--text-regular); white-space: nowrap; }
    .filterbar input, .filterbar select { width: 180px; }
    .toolbar, .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .toolbar { margin-bottom: 12px; }
    .btn, .btn-green, .btn-line { border-radius: 4px; padding: 5px 16px; border: 1px solid var(--border); background: #fff; color: var(--text-title); line-height: 22px; }
    .btn:hover, .btn-line:hover { background: var(--bg-muted); }
    .btn-green { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .btn-green:hover { background: var(--color-primary-hover); }
    .link { border: 0; background: transparent; color: var(--color-primary); padding: 0 8px; }
    .link.danger { color: var(--color-danger); }
    .tag { display: inline-block; border-radius: 4px; padding: 0 8px; line-height: 22px; background: var(--bg-muted); color: var(--text-regular); }
    .tag.green { background: var(--color-success-light); color: var(--color-success); }
    .tag.orange { background: var(--color-warning-light); color: var(--color-warning); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid var(--border); padding: 12px 16px; text-align: left; vertical-align: middle; white-space: nowrap; }
    th { background: var(--bg-muted); color: var(--text-title); font-weight: 700; }
    .more-row td { background: #fff; white-space: normal; }
    .drop, .menu-pop { display: flex; flex-direction: column; width: 180px; min-width: 160px; background: #fff; border: 1px solid var(--border); border-radius: 4px; box-shadow: var(--shadow-base); }
    .drop button, .menu-pop button { border: 0; background: #fff; padding: 8px 16px; text-align: left; color: var(--text-regular); }
    .drop button:hover, .menu-pop button:hover { background: var(--bg-muted); }
    .pop { position: relative; display: inline-block; }
    .menu-pop { position: absolute; top: 36px; left: 0; z-index: 6; }
    .filter-actions { margin-left: auto; display: flex; gap: 8px; flex: none; }
    .kv { display: flex; align-items: flex-start; gap: 8px; min-height: 32px; }
    .kv > span { width: 112px; text-align: right; color: var(--text-regular); flex: none; }
    .kv > b { font-weight: 400; color: var(--text-title); }
    .kv.req > span::before { content: "*"; color: var(--color-danger); margin-right: 4px; }
    .btn-danger { background: var(--color-danger); color: #fff; border-color: var(--color-danger); }
    .btn-danger:hover { background: #c63b35; }
    .crumb button:hover { color: var(--color-primary); }
    .nav-hint { margin: 0 16px 8px; color: var(--color-danger); font-size: 12px; line-height: 20px; }
    .fav button { border: 0; background: transparent; color: var(--text-regular); padding: 0; }
    .notice, .sim, .error, .ok { border-radius: 4px; padding: 8px 16px; margin: 0 0 16px; }
    .notice { background: var(--color-warning-light); color: var(--text-title); }
    .sim { background: var(--color-primary-light); color: var(--text-title); }
    .error { background: var(--color-danger-light); color: var(--text-title); }
    .ok { background: var(--color-success-light); color: var(--text-title); }
    .filters { display: grid; grid-template-columns: 1fr; gap: 16px; margin-bottom: 16px; }
    .filters.wide { grid-template-columns: 1fr 1fr; }
    .filters label, .form-row { display: flex; align-items: center; gap: 8px; }
    .filters label input, .filters label select, .filters label textarea, .form-row textarea { flex: 1; width: auto; max-width: 360px; }
    .filters label span, .form-row span { width: 96px; text-align: right; color: var(--text-regular); flex: none; }
    .req > span::before { content: "*"; color: var(--color-danger); margin-right: 4px; }
    input, select, textarea { border: 1px solid var(--border); border-radius: 4px; padding: 5px 8px; background: #fff; width: 100%; }
    input:focus, select:focus, textarea:focus { border-color: var(--color-primary); outline: none; }
    textarea { min-height: 72px; resize: vertical; }
    input[readonly], textarea[readonly] { background: var(--bg-muted); }
    .fill[readonly] { background: #fff; }
    .grid-3 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 24px; }
    .span-2 { grid-column: span 2; }
    .section { margin-top: 24px; }
    .tabs { display: flex; gap: 0; margin: 16px 0; border-bottom: 1px solid var(--border); }
    .tabs button { border: 0; background: transparent; padding: 8px 16px; color: var(--text-regular); }
    .tabs button[aria-pressed="true"] { color: var(--color-primary); box-shadow: inset 0 -2px 0 var(--color-primary); }
    .state { text-align: center; padding: 48px 16px; color: var(--text-secondary); }
    .empty-art { width: 80px; height: 48px; margin: 0 auto 8px; border-radius: 40px 40px 8px 8px; background: linear-gradient(#F3F3F3, #E7F6F6); }
    .skeleton { height: 16px; margin: 12px 0; border-radius: 4px; background: linear-gradient(90deg, #F3F3F3, #E7F6F6, #F3F3F3); }
    .spinner { width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--color-primary); border-radius: 50%; display: inline-block; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sap-zero { background: var(--color-warning-light); }
    .mask { position: fixed; inset: 0; background: var(--mask); display: flex; align-items: flex-start; justify-content: center; padding: 40px 16px; z-index: 20; }
    .dialog { width: min(800px, 100%); max-height: calc(100vh - 80px); overflow: auto; background: #fff; border-radius: 6px; padding: 32px; box-shadow: var(--shadow-default); }
    .dialog.sm { width: min(512px, 100%); }
    .dialog.xs { width: min(416px, 100%); }
    .dialog-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
    .pop .bubble { position: absolute; z-index: 5; left: 0; top: 36px; width: 240px; background: #fff; border-radius: 6px; box-shadow: var(--shadow-default); padding: 16px; white-space: normal; }
    .pager { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 16px; color: var(--text-regular); }
    .pages { display: flex; gap: 8px; align-items: center; }
    .pages button[aria-current="page"] { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .pages select { width: 112px; color: var(--color-primary); border-color: var(--color-primary); }
    .page-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 24px; }
    .toast { position: fixed; top: 108px; left: 50%; transform: translateX(-50%); background: #fff; border-radius: 4px; box-shadow: var(--shadow-default); padding: 8px 16px; z-index: 30; }
    body.narrow .sider { display: none; }
    body.narrow .filterbar, body.narrow .grid-3, body.narrow .filters, body.narrow .filters.wide { display: block; }
    body.narrow .filterbar input, body.narrow .filterbar select { width: 100%; margin: 8px 0; }
    body.narrow .span-2 { grid-column: auto; }
    body.narrow table, body.narrow thead, body.narrow tbody, body.narrow tr, body.narrow th, body.narrow td { display: block; width: 100%; }
    body.narrow thead { display: none; }
    body.narrow tr { border: 1px solid var(--border); border-radius: 4px; margin-bottom: 8px; }
    body.narrow td { border: 0; white-space: normal; }
    body.narrow td::before { content: attr(data-label); display: block; color: var(--text-secondary); font-size: 12px; line-height: 20px; }
  </style>
</head>
<body>
  <header class="control" aria-label="原型控制条">
    <p>原型控制条，不是正式功能</p>
    <div class="control-row" role="group" aria-label="场景切换">
      <button type="button" data-scene="list">主路径 · 订单列表</button>
      <button type="button" data-scene="route">分支 · 工艺路线</button>
      <button type="button" data-scene="bom">分支 · 物料清单</button>
      <button type="button" data-scene="detail">分支 · 订单详情</button>
      <button type="button" data-scene="oplog">分支 · 操作日志</button>
      <button type="button" data-scene="apilog">分支 · 接口日志</button>
      <button type="button" data-scene="work">分支 · 工单</button>
      <button type="button" data-scene="material">分支 · 物料主数据</button>
    </div>
    <div class="control-row" role="group" aria-label="状态切换">
      <button type="button" data-mode="empty">空</button>
      <button type="button" data-mode="loading">加载</button>
      <button type="button" data-mode="success">成功</button>
      <button type="button" data-mode="failure">失败</button>
      <button type="button" data-mode="forbidden">无权限</button>
      <button type="button" data-mode="boundary">边界</button>
    </div>
    <div class="control-row">
      <button type="button" id="reset">重置</button>
      <button type="button" id="viewport" aria-pressed="false">窄屏</button>
      <span id="viewport-flag" class="flag">当前为桌面</span>
    </div>
  </header>
  <main id="app" aria-live="polite"></main>
  <script>
    const orders = [
      order("SAMPLE-28673", "SAMPLE-MAT-3350-01", "样本物料-灭菌顶头袋", "", "SAMPLE-1008U", "样本客户甲", "完工", "SAMPLE-ROUTE-464", "SAMPLE-BOM-3350-01", "104", "样本车间", "样本仓", "样本/量产订单"),
      order("SAMPLE-17850", "SAMPLE-MAT-15588", "样本物料-灭菌头袋", "", "SAMPLE-0928U", "样本客户乙", "完工", "SAMPLE-ROUTE-465", "SAMPLE-BOM-15588", "80", "样本车间", "样本仓", "样本/量产订单"),
      order("SAMPLE-97865", "SAMPLE-MAT-3450-02", "样本物料-介入包", "SAMPLE-STYLE-02", "SAMPLE-1007U", "样本客户丙", "已开工", "SAMPLE-ROUTE-466", "SAMPLE-BOM-3450-02", "56", "样本车间", "样本仓", "样本/量产订单")
    ];

    const processes = {
      "SAMPLE-28673": [step("0010", "样本工序-包装工作中心", "SAMPLE-OP-210", "104")],
      "SAMPLE-17850": [step("0010", "样本工序-包装工作中心", "SAMPLE-OP-211", "80")],
      "SAMPLE-97865": [step("0010", "样本工序-包装工作中心", "SAMPLE-OP-212", "56")]
    };

    const boms = {
      "SAMPLE-28673": [
        bom("0001", "SAMPLE-ITEM-0103", "样本组件-包装袋", "13.000", "PC", "件", "0", "0.125", "13", "13", "100%", false),
        bom("0002", "SAMPLE-ITEM-0133", "样本组件-灭菌包", "117.000", "EA", "个", "117", "1.125", "13", "0", "100%", true),
        bom("0003", "SAMPLE-ITEM-8375", "样本组件-合格证", "13.000", "E17", "张", "0", "0.125", "13", "13", "100%", false)
      ],
      "SAMPLE-17850": [bom("0001", "SAMPLE-ITEM-1001", "样本组件-袋体", "80.000", "PC", "件", "0", "1", "80", "80", "100%", false)],
      "SAMPLE-97865": [bom("0001", "SAMPLE-ITEM-2002", "样本组件-介入包材", "56.000", "PC", "件", "0", "1", "56", "0", "100%", true)]
    };

    function seedOps() {
      return [
        op("o1", "SAMPLE-28673", "2026-10-09 14:26", "样本用户甲", [
          ["数量", "100", "104"],
          ["优先级", "2/3", "3/3"],
          ["仓库", "样本仓甲", "样本仓"]
        ]),
        op("o2", "SAMPLE-28673", "2026-10-09 09:03", "样本用户乙", [
          ["生产批号", "SAMPLE-1007U", "SAMPLE-1008U"],
          ["备注", "空", "样本备注"]
        ]),
        op("o3", "SAMPLE-17850", "2026-10-08 16:41", "样本用户甲", [
          ["计划状态", "关闭", "开启"],
          ["客户", "样本客户甲", "样本客户乙"]
        ])
      ];
    }
    let opLogs = seedOps();

    let apiLogs = [
      api("a1", "SAMPLE-28673", "2026-10-09 15:53:21", "计划工单", "SAP推送订单数据", "/api/sample/sap/shoporder/sync", "1100"),
      api("a2", "SAMPLE-28673", "2026-10-09 14:30:00", "生产入库", "sap线边入库", "/api/sample/mes/warehouse/in", "860"),
      api("a3", "SAMPLE-17850", "2026-10-08 11:02:00", "报工模块", "sap同步报工", "/api/sample/mes/report/sync", "48")
    ];

    const initialApiForm = () => ({
      start: "2026-10-02T15:56",
      end: "2026-10-09T15:56",
      module: "",
      op: "",
      sender: "",
      body: "",
      response: "",
      trace: "",
      exception: "",
      collapsed: false,
      error: "",
      searched: false
    });

    const state = {
      scene: "list",
      mode: "success",
      planNo: "SAMPLE-28673",
      narrow: false,
      retried: false,
      notice: "",
      tab: "base",
      opDetail: null,
      apiModal: null,
      apiPretty: false,
      listOpen: false,
      listMore: false,
      listPlan: "",
      listMaterial: "",
      listError: "",
      toolMore: false,
      navQuery: "",
      navHint: "",
      page: 1,
      pageSize: 20,
      morePlan: "",
      editError: "",
      splitPlan: "",
      splitError: "",
      deletePlan: "",
      hidden: {},
      checked: {},
      apiForm: initialApiForm(),
      synced: false
    };

    function order(planNo, materialNo, desc, styleNo, batch, customer, prodStatus, routeNo, bomNo, qty, workshop, warehouse, planType) {
      return { planNo, materialNo, desc, styleNo, batch, customer, publish: "已发布", planStatus: "开启", prodStatus, routeNo, bomNo, qty, unit: "包", version: "1", workshop, warehouse, planType, priority: "3/3", remark: planNo === "SAMPLE-28673" ? "样本备注" : "", start: "2026-10-09 00:00:00", end: "2026-10-14 00:00:00", expire: "2028-10-07", manager: "样本管理者", color: "样本颜色", size: "样本尺码" };
    }
    function step(no, name, code, qty) { return { no, name, code, qty, unit: "包" }; }
    function bom(no, code, name, qty, unit, unitName, locked, unitQty, win, sap, rate, zero) {
      return { no, code, name, qty, unit, unitName, locked, unitQty, win, sap, rate, zero, opNo: "0010", opName: "样本工序" };
    }
    function op(id, planNo, time, actor, fields) {
      return {
        id, planNo, time, actor, action: "更新",
        fields: fields.map(([field, before, after]) => ({ field, before, after }))
      };
    }
    function api(id, planNo, time, module, action, url, cost) {
      return {
        id, planNo, time, module, action, url, cost,
        ip: "样本-10.0.0.21", status: "200", target: "样本目标地址", trace: "SAMPLE-TRACE-" + id,
        exception: "无",
        head: '{"sample":true,"source":"原型"}',
        body: '{"sample":true,"planNo":"' + planNo + '"}',
        resp: '{"code":200,"message":"样本：请求成功","success":true}'
      };
    }

    function currentOrder() {
      return orders.find((item) => item.planNo === state.planNo) || orders[0];
    }

    function boundaryOrders() {
      const longDesc = "样本物料-名称用于走查超长显示时仍要看见计划号、工艺路线号和BOM号";
      return [order("SAMPLE-EDGE-2359", "SAMPLE-MAT-EDGE", longDesc, "SAMPLE-STYLE-LONG", "SAMPLE-2359U", "样本客户-名称超长用于边界走查", "完工", "SAMPLE-ROUTE-2359", "SAMPLE-BOM-EDGE", "1", "样本车间", "样本仓-名称超长", "样本/量产订单")]
        .concat(Array.from({ length: 11 }, (_, index) => order("SAMPLE-EDGE-" + (index + 2), "SAMPLE-MAT-" + index, "样本物料", "", "SAMPLE-0000U", "样本客户", "已开工", "SAMPLE-ROUTE-" + index, "SAMPLE-BOM-" + index, "1", "样本车间", "样本仓", "样本/量产订单")));
    }

    function listRows() {
      if (["empty", "loading", "failure", "forbidden"].includes(state.mode)) return [];
      const source = (state.mode === "boundary" ? boundaryOrders() : orders).filter((item) => !state.hidden[item.planNo]);
      const keyword = state.listPlan.trim();
      const material = state.listMaterial.trim();
      let filtered = keyword ? source.filter((item) => item.planNo.includes(keyword)) : source;
      if (material) filtered = filtered.filter((item) => item.materialNo.includes(material));
      const start = (state.page - 1) * state.pageSize;
      return { all: filtered, page: filtered.slice(start, start + state.pageSize) };
    }

    function esc(value) {
      return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;");
    }

    const NAV = [
      ["list", "生产订单"],
      ["route", "工艺路线"],
      ["bom", "物料清单"],
      ["oplog", "操作日志"],
      ["apilog", "接口日志"],
      ["work", "工单"],
      ["material", "物料主数据"]
    ];

    function render() {
      document.body.classList.toggle("narrow", state.narrow);
      document.querySelectorAll("[data-scene]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.scene === state.scene)));
      document.querySelectorAll("[data-mode]").forEach((button) => button.setAttribute("aria-pressed", String(button.dataset.mode === state.mode)));
      document.getElementById("viewport").setAttribute("aria-pressed", String(state.narrow));
      document.getElementById("viewport-flag").textContent = state.narrow ? "当前为窄屏" : "当前为桌面";
      const screens = { list: listHtml, route: routeHtml, bom: bomHtml, detail: detailHtml, edit: editHtml, oplog: opHtml, apilog: apiHtml, work: workHtml, material: materialHtml };

    function shell(screen, inner) {
      const titles = { list: "生产订单", route: "工艺路线", bom: "物料清单", detail: "订单详情", edit: "编辑生产订单", oplog: "操作日志", apilog: "日志管理", work: "工单", material: "物料主数据" };

      ).join("") || `<p class="nav-hint">没有匹配的菜单</p>`;

          <div class="content"><div class="panel" data-screen="${screen}">${inner}</div></div>
        </div>
      </div>`;

    function banner() {
      return '<span class="sample">样本数据，仅供走查</span>' +
        (state.retried ? '<p class="ok" id="retry-banner">已重新获取样本数据</p>' : "") +
        (state.notice ? '<p class="notice" id="notice">' + esc(state.notice) + "</p>" : "");

    function gate(emptyText, title) {
      if (state.mode === "loading") {
        return '<div class="state" id="loading"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><p>正在加载' + title + '</p><button type="button" class="btn-green" id="finish-loading" data-act="finish-loading">结束加载</button></div>';
      }
      if (state.mode === "failure") {
        return '<div class="state" id="failure"><p>' + title + '没有加载出来</p><button type="button" class="btn-green" id="retry" data-act="retry">重试</button></div>';
      }
      if (state.mode === "forbidden") {
        return '<div class="state" id="forbidden"><p>当前账号不能查看' + title + "</p></div>";
      }
      if (state.mode === "empty") {
        return '<div class="state" id="empty"><div class="empty-art"></div><p>' + emptyText + "</p></div>";
      }
      return "";

        <p class="sim">模拟规则：只展示订单上已经出现的物料号、描述和单位。物料组、规格未在截图中出现，显示待确认。</p>
        ${blocked || `<div class="grid-3">
          ${readonly("物料号", item.materialNo)}${readonly("物料描述", item.desc, true)}${readonly("单位", item.unit)}
          ${readonly("物料组", "待确认")}${readonly("规格", "待确认")}
        </div>`}${pageFoot()}`;
    }

    function opHtml() {
      const item = currentOrder();
      let rows = opLogs.filter((line) => line.planNo === item.planNo);
      if (state.mode === "boundary") {
        rows = [
          op("ob1", item.planNo, "2026-10-09 23:59", "样本用户甲-姓名超长用于确认操作人和时间完整可见", [
            ["数量", "1", "2"],
            ["仓库", "样本仓", "样本仓-名称超长用于边界走查"],
            ["优先级", "1/3", "3/3"]
          ]),
          op("ob2", item.planNo, "2026-10-09 00:00", "样本用户乙", [
            ["计划开始日期", "2026-10-08 00:00", "2026-10-09 00:00"],
            ["计划结束日期", "2026-10-09 18:00", "2026-10-09 23:59"]
          ])
        ];
      }
      const blocked = gate("这张生产订单还没有操作日志", "操作日志");
      const blocks = rows.map((line) => `<article class="section" id="op-${line.id}">
        <p><button type="button" class="link" data-act="op-detail" data-id="${line.id}">${esc(line.time)}</button> ${esc(line.actor)} ${esc(line.action)}</p>

      if (state.opDetail && !blocked) {
        const line = rows.find((entry) => entry.id === state.opDetail) || rows[0];
        return `<div data-screen="oplog-detail">${banner()}${crumb("操作日志")}<h1>操作日志</h1>
          <p id="detail-actor">${esc(line.actor)} 在 ${esc(line.time)} ${esc(line.action)}了 ${line.fields.length} 个字段</p>
          <div class="table-wrap">${fieldTable(line.fields)}</div>
          <div class="page-foot"><button type="button" class="btn" data-act="op-back">返回</button></div>
        </div>`;
      }
      return `${banner()}${crumb("操作日志")}<h1>操作日志</h1>
        <p>生产订单 ${esc(item.planNo)}（样本）</p>
        <p class="sim">模拟规则：一条日志是一次更新。同一次改了多个字段时，字段、变更前、变更后列在这一条下面。</p>
        ${blocked || (blocks ? `<div id="op-list">${blocks}</div>` : '<div class="state" id="op-empty"><div class="empty-art"></div><p>这张生产订单还没有操作日志</p></div>')}
        ${pageFoot()}`;
    }

    function splitHtml() {
      if (!state.splitPlan) return "";
      const item = orders.find((entry) => entry.planNo === state.splitPlan);
      if (!item) return "";
      return `<div class="mask" id="split-dialog"><div class="dialog sm" role="dialog" aria-modal="true" aria-labelledby="split-title">
        <div class="dialog-head"><h1 id="split-title">拆分</h1><button type="button" class="btn" data-act="split-cancel">关闭</button></div>
        <p>计划号 ${esc(item.planNo)}，当前数量 ${esc(item.qty)}（样本）</p>
        <p class="sim">模拟规则：取消或按 Esc 关闭后，拆出数量清空。确定后只写一条操作日志。</p>
        <form id="split-form" class="filters">
          <label class="req"><span>拆出数量</span><input id="split-qty" name="qty" value=""></label>
          ${state.splitError ? `<p class="error" id="split-error">${esc(state.splitError)}</p>` : ""}
          <div class="dialog-actions"><button class="btn" type="button" data-act="split-cancel">取消</button><button class="btn-green" type="submit">确定</button></div>
        </form>
      </div></div>`;
    }

    function apiHtml() {
      const form = state.apiForm;
      const blocked = gate("没有符合条件的接口日志", "接口日志");
      const fields = `
        <label class="req"><span>开始时间</span><input id="api-start" type="datetime-local" name="start" value="${esc(form.start)}"></label>
        <label class="req"><span>结束时间</span><input id="api-end" type="datetime-local" name="end" value="${esc(form.end)}"></label>
        <label><span>模块</span><select name="module"><option value="">请选择</option><option ${form.module === "计划工单" ? "selected" : ""}>计划工单</option><option ${form.module === "生产入库" ? "selected" : ""}>生产入库</option><option ${form.module === "报工模块" ? "selected" : ""}>报工模块</option></select></label>
        <label><span>操作</span><input name="op" value="${esc(form.op)}" placeholder="请输入操作"></label>
        <label><span>发送方URL</span><input name="sender" value="${esc(form.sender)}" placeholder="请输入发送方URL"></label>
        <label><span>请求体</span><input id="api-body" name="body" value="${esc(form.body)}" placeholder="请输入计划号"></label>
        <label><span>响应体</span><input name="response" value="${esc(form.response)}" placeholder="请输入响应体"></label>
        <label><span>traceId</span><input name="trace" value="${esc(form.trace)}" placeholder="请输入traceId"></label>
        <label><span>异常信息</span><input name="exception" value="${esc(form.exception)}" placeholder="请输入异常信息"></label>`;
      let result = "";
      if (!blocked && form.searched) {
        const rows = filterApi();
        result = rows.length ? `<div class="table-wrap"><table><thead><tr><th>操作IP地址</th><th>操作时间</th><th>消耗时间</th><th>操作 url</th><th>请求状态</th><th>模块</th><th>具体操作</th><th>目标 url</th><th>traceId</th><th>异常信息</th><th>操作</th></tr></thead><tbody id="api-list">${rows.map((line) => `<tr>
          <td data-label="操作IP地址">${esc(line.ip)}</td>
          <td data-label="操作时间">${esc(line.time)}</td>
          <td data-label="消耗时间">${esc(line.cost)}</td>
          <td data-label="操作 url">${esc(line.url)}</td>
          <td data-label="请求状态">${esc(line.status)}</td>
          <td data-label="模块">${esc(line.module)}</td>
          <td data-label="具体操作">${esc(line.action)}</td>
          <td data-label="目标 url">${esc(line.target)}</td>
          <td data-label="traceId">${esc(line.trace)}</td>
          <td data-label="异常信息">${esc(line.exception)}</td>
          <td data-label="操作"><button type="button" class="link" data-act="api-view" data-id="${line.id}">查看</button></td>
        </tr>`).join("")}</tbody></table></div>` : '<div class="state" id="api-empty"><p>没有符合条件的接口日志</p></div>';
      }
      const visible = form.collapsed ? `
        <label class="req"><span>开始时间</span><input id="api-start" type="datetime-local" name="start" value="${esc(form.start)}"></label>
        <label class="req"><span>结束时间</span><input id="api-end" type="datetime-local" name="end" value="${esc(form.end)}"></label>
        <label><span>请求体</span><input id="api-body" name="body" value="${esc(form.body)}" placeholder="请输入计划号"></label>` : fields;
      return `${banner()}${crumb("日志管理")}<h1>日志管理</h1>
        <p class="sim">模拟规则：从订单进入时，把计划号填进请求体。地址、IP、traceId 都是样本，不发起请求。开始时间和结束时间必填。重置清空条件，已输入内容不保留。</p>
        <div class="toolbar"><button type="button" class="btn-green" data-act="api-refresh">刷新</button></div>
        <form id="api-form" class="filters wide">${visible}
          <div class="dialog-actions">
            <button type="button" class="btn" data-act="api-collapse">${form.collapsed ? "更多" : "收起"}</button>
            <button type="button" class="btn" data-act="api-reset">重置</button>
            <button type="submit" class="btn-green" id="api-search">搜索</button>
          </div>
          ${form.error ? `<p class="error" id="api-error">${esc(form.error)}</p>` : ""}
        </form>
        ${blocked || result || '<div class="state"><p>填写开始时间和结束时间后搜索</p></div>'}
        ${!blocked && form.searched ? `<div class="pager"><span>共 ${filterApi().length} 项数据</span></div>` : ""}
        ${pageFoot()}`;
    }

    function filterApi() {
      if (["empty", "loading", "failure", "forbidden"].includes(state.mode)) return [];
      const form = state.apiForm;
      return apiLogs.filter((line) => {
        const stamp = line.time.replace(" ", "T").slice(0, 16);
        if (form.start && stamp < form.start) return false;
        if (form.end && stamp > form.end) return false;
        if (form.module && line.module !== form.module) return false;
        if (form.op && !line.action.includes(form.op)) return false;
        if (form.body && !line.body.includes(form.body) && line.planNo !== form.body) return false;
        if (form.trace && !line.trace.includes(form.trace)) return false;
        if (form.exception && form.exception !== "无" && !line.exception.includes(form.exception)) return false;
        return true;
      });
    }

    function modalHtml() {
      const line = apiLogs.find((item) => item.id === state.apiModal);
      if (!line) return "";
      const pretty = state.apiPretty ? `<pre id="json-preview">${esc(line.body)}\n${esc(line.resp)}</pre>` : "";
      return `<div class="mask" id="modal"><div class="dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="dialog-head"><h1 id="modal-title">查看详情</h1><button type="button" class="btn" data-act="modal-close">关闭</button></div>
        <div class="grid-3">
          ${readonly("模块", line.module)}${readonly("具体操作", line.action)}${readonly("URL", line.url)}
          ${readonly("IP", line.ip)}${readonly("traceId", line.trace)}${readonly("异常信息", line.exception)}
        </div>
        <label class="form-row"><span>请求头</span><textarea readonly>${esc(line.head)}</textarea></label>
        <label class="form-row"><span>请求体</span><textarea readonly>${esc(line.body)}</textarea></label>
        <label class="form-row"><span>响应体</span><textarea readonly>${esc(line.resp)}</textarea></label>
        ${pretty}
        <div class="dialog-actions"><button type="button" class="btn" data-act="modal-close">取消</button><button type="button" class="btn-green" data-act="json">JSON预览</button></div>
      </div></div>`;
    }

    function readonly(label, value, wide) {
      return `<div class="kv${wide ? " span-2" : ""}"><span>${esc(label)}</span><b>${esc(value)}</b></div>`;
    }
    function field(label, value) {
      return `<div class="kv req"><span>${esc(label)}</span><b>${esc(value)}</b></div>`;
    }
    function linkField(label, value, act, plan) {
      return `<label class="req">${label}<button type="button" class="link" data-act="${act}" data-plan="${plan}">${esc(value)}</button></label>`;
    }

    function openOrder(plan, scene) {
      state.planNo = plan;
      state.scene = scene;
      state.opDetail = null;
      state.apiModal = null;
      state.notice = "";
      if (scene === "apilog") {
        state.apiForm.body = plan;
        state.apiForm.searched = true;
        state.apiForm.error = "";
        if (!state.apiForm.start) state.apiForm.start = "2026-10-02T15:56";
        if (!state.apiForm.end) state.apiForm.end = "2026-10-09T15:56";
      }
      render();
    }

    function readApiForm(form) {
      const data = new FormData(form);
      ["start", "end", "module", "op", "sender", "body", "response", "trace", "exception"].forEach((key) => {
        if (form.elements.namedItem(key)) state.apiForm[key] = data.get(key) || "";
      });
    }

    function validateApi() {
      if (!state.apiForm.start) return "请填写开始时间";
      if (!state.apiForm.end) return "请填写结束时间";
      if (state.apiForm.end < state.apiForm.start) return "结束时间要晚于开始时间";
      return "";
    }

    document.getElementById("app").addEventListener("click", (event) => {
      if (event.target.id === "split-dialog") {
        state.splitPlan = "";
        state.splitError = "";
        render();
        return;
      }
      if (event.target.id === "modal") {
        state.apiModal = null;
        render();
        return;
      }
      const target = event.target.closest("[data-act]");
      if (!target) return;
      const act = target.dataset.act;
      if (act === "menu" || act === "home" || act === "close-tab") {
        const to = act === "menu" ? target.dataset.to : "list";
        state.opDetail = null;
        state.apiModal = null;
        state.notice = "";
        state.toolMore = false;
        if (to === "list") {
          state.scene = "list";
          render();
        } else {
          openOrder(state.planNo, to);
        }
        return;
      }
      if (act === "more") {
        state.morePlan = state.morePlan === target.dataset.plan ? "" : target.dataset.plan;
        if (!state.morePlan) state.deletePlan = "";
        render();
        return;
      }
      if (act === "tool-more") {
        state.toolMore = !state.toolMore;
        render();
        return;
      }
      if (act === "list-more") {
        const form = document.getElementById("list-form");
        if (form) {
          state.listPlan = new FormData(form).get("plan") || "";
          const material = new FormData(form).get("material");
          if (material !== null) state.listMaterial = material;
        }
        state.listMore = !state.listMore;
        render();
        return;
      }
      if (act === "check") {
        state.checked[target.dataset.plan] = target.checked;
        return;
      }
      if (act === "route" || act === "bom" || act === "detail" || act === "oplog" || act === "apilog" || act === "work" || act === "material") {
        openOrder(target.dataset.plan, act === "detail" ? "detail" : act);
        state.morePlan = "";
        return;
      }
      if (act === "edit") {
        state.planNo = target.dataset.plan;
        state.scene = "edit";
        state.editError = "";
        state.morePlan = "";
        state.notice = "";
        render();
        return;
      }
      if (act === "split") {
        state.splitPlan = target.dataset.plan;
        state.splitError = "";
        state.morePlan = "";
        render();
        return;
      }
      if (act === "split-cancel") {
        state.splitPlan = "";
        state.splitError = "";
        render();
        return;
      }
      if (act === "delete") {
        state.deletePlan = target.dataset.plan;
        state.morePlan = target.dataset.plan;
        render();
        return;
      }
      if (act === "delete-cancel") {
        state.deletePlan = "";
        render();
        return;
      }
      if (act === "delete-confirm") {
        state.hidden[target.dataset.plan] = true;
        state.deletePlan = "";
        state.morePlan = "";
        state.notice = "样本：该订单已从列表隐藏。点击重置可恢复。";
        render();
        return;
      }
      if (act === "back-list") {
        state.scene = "list";
        state.opDetail = null;
        state.apiModal = null;
        state.notice = "";
        render();
        return;
      }
      if (act === "hold" || act === "toolbar") {
        const selected = Object.values(state.checked).some(Boolean);
        state.toolMore = false;
        if (["关闭", "开启", "批量编辑", "勾选导出"].includes(target.dataset.name) && !selected) {
          state.notice = "请先勾选生产订单。";
        } else {
          state.notice = target.dataset.name + "不在本次整合范围，按钮保留为现有界面对照，没有连接正式操作。";
        }
        render();
        return;
      }
      if (act === "list-reset") {
        state.listPlan = "";
        state.listMaterial = "";
        state.listError = "";
        state.page = 1;
        render();
        return;
      }
      if (act === "page") {
        const pages = Math.max(1, Math.ceil((state.total || 0) / state.pageSize) || 1);
        const next = Number(target.dataset.page);
        if (next < 1) state.notice = "已经是第一页";
        else if (next > pages) state.notice = "已经是最后一页";
        else { state.page = next; state.notice = ""; }
        render();
        return;
      }
      if (act === "sync") {
        state.synced = true;
        apiLogs.unshift(api("sync-" + Date.now(), state.planNo, "2026-10-09 15:50:00", "计划工单", "样本同步", "/api/sample/sap/shoporder/sync", "120"));
        state.notice = "";
        render();
        return;
      }
      if (act === "tab") {
        state.tab = target.dataset.tab;
        render();
        return;
      }
      if (act === "op-detail") {
        state.opDetail = target.dataset.id;
        render();
        return;
      }
      if (act === "op-back") {
        state.opDetail = null;
        render();
        return;
      }
      if (act === "api-view") {
        state.apiModal = target.dataset.id;
        state.apiPretty = false;
        render();
        return;
      }
      if (act === "modal-close") {
        state.apiModal = null;
        render();
        return;
      }
      if (act === "json") {
        state.apiPretty = !state.apiPretty;
        render();
        return;
      }
      if (act === "api-collapse") {
        const form = document.getElementById("api-form");
        if (form) readApiForm(form);
        state.apiForm.collapsed = !state.apiForm.collapsed;
        render();
        return;
      }
      if (act === "api-reset") {
        const body = state.apiForm.body;
        state.apiForm = initialApiForm();
        state.apiForm.body = "";
        state.notice = body ? "" : "";
        render();
        return;
      }
      if (act === "api-refresh") {
        const form = document.getElementById("api-form");
        if (form) readApiForm(form);
        state.apiForm.error = validateApi();
        state.apiForm.searched = !state.apiForm.error;
        render();
        return;
      }
      if (act === "finish-loading") {
        state.mode = "success";
        render();
        return;
      }
      if (act === "retry") {
        state.mode = "success";
        state.retried = true;
        render();
      }
    });

    document.getElementById("app").addEventListener("submit", (event) => {
      event.preventDefault();
      if (event.target.id === "edit-form") {
        const item = currentOrder();
        const data = new FormData(event.target);
        const qty = String(data.get("qty") || "").trim();
        const priority = String(data.get("priority") || "").trim();
        const warehouse = String(data.get("warehouse") || "").trim();
        const remark = String(data.get("remark") || "").trim();
        if (!qty || !priority || !warehouse) {
          state.editError = "请填写数量、优先级和仓库";
          render();
          return;
        }
        if (!/^\d+(\.\d+)?$/.test(qty) || Number(qty) <= 0) {
          state.editError = "数量需要是大于 0 的数字";
          render();
          return;
        }
        const fields = [];
        if (qty !== String(item.qty)) fields.push(["数量", String(item.qty), qty]);
        if (priority !== item.priority) fields.push(["优先级", item.priority, priority]);
        if (warehouse !== item.warehouse) fields.push(["仓库", item.warehouse, warehouse]);
        if (remark !== item.remark) fields.push(["备注", item.remark || "空", remark || "空"]);
        if (!fields.length) {
          state.editError = "没有字段变化，未写入操作日志";
          render();
          return;
        }
        item.qty = qty;
        item.priority = priority;
        item.warehouse = warehouse;
        item.remark = remark;
        opLogs.unshift(op("edit-" + Date.now(), item.planNo, "2026-10-09 16:20", "样本用户甲", fields));
        state.editError = "";
        state.scene = "oplog";
        state.planNo = item.planNo;
        state.notice = "样本：已保存，并写入一条包含 " + fields.length + " 个字段的操作日志。";
        render();
        return;
      }
      if (event.target.id === "split-form") {
        const item = orders.find((entry) => entry.planNo === state.splitPlan);
        const raw = String(new FormData(event.target).get("qty") || "").trim();
        const current = Number(item.qty);
        const next = Number(raw);
        if (!raw) {
          state.splitError = "请填写拆出数量";
        } else if (!/^\d+(\.\d+)?$/.test(raw) || next <= 0 || next >= current) {
          state.splitError = "拆出数量需要大于 0，并且小于当前数量 " + item.qty;
        } else {
          const remain = String(current - next);
          opLogs.unshift(op("split-" + Date.now(), item.planNo, "2026-10-09 16:30", "样本用户甲", [
            ["数量", item.qty, remain],
            ["拆出数量", "0", raw]
          ]));
          item.qty = remain;
          state.splitPlan = "";
          state.splitError = "";
          state.scene = "oplog";
          state.planNo = item.planNo;
          state.notice = "样本：拆分已记入同一条操作日志，包含数量和拆出数量。";
        }
        render();
        return;
      }
      if (event.target.id === "list-form") {
        const data = new FormData(event.target);
        const value = data.get("plan") || "";
        const material = data.get("material");
        if ((value.trim() === "" && value.length > 0) || (material !== null && material.trim() === "" && material.length > 0)) {
          state.listError = value.trim() === "" && value.length > 0 ? "请输入计划号" : "请输入物料号";
          state.listPlan = value;
          if (material !== null) state.listMaterial = material;
        } else {
          state.listError = "";
          state.listPlan = value.trim();
          state.listMaterial = material === null ? state.listMaterial : material.trim();
          state.page = 1;
        }
        render();
        return;
      }
      if (event.target.id === "api-form") {
        readApiForm(event.target);
        state.apiForm.error = validateApi();
        state.apiForm.searched = !state.apiForm.error;
        render();
      }
    });

    document.querySelectorAll("[data-scene]").forEach((button) => button.addEventListener("click", () => {
      state.scene = button.dataset.scene;
      state.opDetail = null;
      state.apiModal = null;
      state.notice = "";
      render();
    }));
    document.querySelectorAll("[data-mode]").forEach((button) => button.addEventListener("click", () => {
      state.mode = button.dataset.mode;
      state.opDetail = null;
      state.apiModal = null;
      render();
    }));
    document.getElementById("reset").addEventListener("click", () => {
      state.scene = "list";
      state.mode = "success";
      state.planNo = "SAMPLE-28673";
      state.narrow = false;
      state.retried = false;
      state.notice = "";
      state.tab = "base";
      state.opDetail = null;
      state.apiModal = null;
      state.apiPretty = false;
      state.listOpen = false;
      state.listMore = false;
      state.listPlan = "";
      state.listMaterial = "";
      state.listError = "";
      state.toolMore = false;
      state.navQuery = "";
      state.navHint = "";
      state.page = 1;
      state.pageSize = 20;
      state.checked = {};
      state.morePlan = "";
      state.editError = "";
      state.splitPlan = "";
      state.splitError = "";
      state.deletePlan = "";
      state.hidden = {};
      state.apiForm = initialApiForm();
      state.synced = false;
      opLogs = seedOps();
      orders.forEach((item) => {
        if (item.planNo === "SAMPLE-28673") {
          item.qty = "104";
          item.priority = "3/3";
          item.warehouse = "样本仓";
          item.remark = "样本备注";
        }
        if (item.planNo === "SAMPLE-17850") item.qty = "80";
        if (item.planNo === "SAMPLE-97865") item.qty = "56";
      });
      apiLogs = apiLogs.filter((item) => !String(item.id).startsWith("sync-"));
      render();
    });
    document.getElementById("viewport").addEventListener("click", () => {
      state.narrow = !state.narrow;
      render();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        if (state.apiModal) state.apiModal = null;
        else if (state.splitPlan) { state.splitPlan = ""; state.splitError = ""; }
        else if (state.deletePlan) state.deletePlan = "";
        else if (state.opDetail) state.opDetail = null;
        else if (state.toolMore) state.toolMore = false;
        else if (state.morePlan) { state.morePlan = ""; state.deletePlan = ""; }
        else if (state.notice) state.notice = "";
        else return;
        render();
      }
    });
    document.getElementById("app").addEventListener("change", (event) => {
      if (event.target.id === "page-size") {
        state.pageSize = Number(event.target.value);
        state.page = 1;
        state.notice = "每页 " + state.pageSize + " 条（样本）";
        render();
      }
    });
    document.getElementById("app").addEventListener("input", (event) => {
      if (event.target.id !== "nav-search") return;
      state.navQuery = event.target.value;
      const query = state.navQuery.trim();
      if (!query && state.navQuery.length) {
        state.navHint = "请输入菜单名称";
      } else if (query && !NAV.some(([, name]) => name.includes(query))) {
        state.navHint = "没有匹配的菜单";
      } else {
        state.navHint = "";
      }
      document.querySelectorAll(".menu button").forEach((button) => {
        button.hidden = Boolean(query) && !button.textContent.includes(query);
      });
      let hint = document.getElementById("nav-hint");
      if (state.navHint) {
        if (!hint) {
          hint = document.createElement("p");
          hint.id = "nav-hint";
          hint.className = "nav-hint";
          event.target.parentElement.after(hint);
        }
        hint.textContent = state.navHint;
      } else if (hint) {
        hint.remove();
      }
    });
    document.getElementById("app").addEventListener("keydown", (event) => {
      if (event.target.id !== "nav-search" || event.key !== "Enter") return;
      event.preventDefault();
      const query = state.navQuery.trim();
      if (!query) {
        state.navHint = state.navQuery.length ? "请输入菜单名称" : "";
        render();
        return;
      }
      const hit = NAV.find(([, name]) => name.includes(query));
      if (!hit) {
        state.navHint = "没有匹配的菜单";
        render();
        return;
      }
      state.navHint = "";
      if (hit[0] === "list") {
        state.scene = "list";
        render();
      } else {
        openOrder(state.planNo, hit[0]);
      }
    });
    render();
  </script>
</body>
</html>
